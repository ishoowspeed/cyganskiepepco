<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyganskie Pepco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,900;1,900&family=Barlow:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:      #D41820;
    --red-dk:   #AA1018;
    --yellow:   #F5C800;
    --yellow-dk:#D4AA00;
    --white:    #FFFFFF;
    --bg:       #F4F4F4;
    --card:     #FFFFFF;
    --border:   #E0E0E0;
    --grey:     #666;
    --text:     #1A1A1A;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .icon {
    font-family: 'Material Symbols Outlined';
    font-style: normal;
    font-weight: normal;
    font-size: 22px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    vertical-align: middle;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--red);
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 200;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    user-select: none;
  }

  .logo-img {
    height: 42px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-style: italic;
    color: var(--white);
    font-size: 26px;
    line-height: 1;
    text-shadow: 1px 2px 4px rgba(0,0,0,.3);
  }

  .logo-text small {
    display: block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    opacity: .85;
  }

  .cart-btn {
    background: var(--yellow);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .15s;
  }
  .cart-btn:hover { background: var(--yellow-dk); }

  .cart-badge {
    background: var(--red-dk);
    color: white;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 13px;
    font-weight: 700;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .cart-badge.show { display: flex; }

  /* ===== PROMO STRIP ===== */
  .promo-strip {
    background: var(--yellow);
    text-align: center;
    padding: 8px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--red-dk);
    letter-spacing: .4px;
  }

  /* ===== MAIN ===== */
  main {
    max-width: 960px;
    margin: 28px auto;
    padding: 0 16px;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 30px;
    color: var(--red-dk);
    margin-bottom: 20px;
    border-left: 5px solid var(--yellow);
    padding-left: 12px;
  }

  /* ===== PRODUCT GRID ===== */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .product-card {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.09);
    display: flex;
    flex-direction: column;
    transition: box-shadow .2s;
  }
  .product-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.14); }

  .product-img-wrap {
    position: relative;
    background: #EBEBEB;
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }

  .product-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 16px;
    display: block;
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .badge-new  { background: var(--red);    color: white; }
  .badge-hot  { background: var(--yellow); color: var(--red-dk); }
  .badge-sale { background: #222;          color: white; }

  .product-body {
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .product-brand {
    font-size: 11px;
    font-weight: 600;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }

  .product-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.15;
  }

  .product-desc {
    font-size: 13px;
    color: var(--grey);
    line-height: 1.5;
    margin-bottom: 14px;
    flex: 1;
  }

  .product-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: var(--red);
    margin-bottom: 12px;
  }
  .product-price sup {
    font-size: 14px;
    color: var(--grey);
    font-weight: 600;
    margin-left: 3px;
  }

  .add-btn {
    width: 100%;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 11px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background .15s, transform .1s;
    letter-spacing: .3px;
  }
  .add-btn:hover  { background: var(--red-dk); }
  .add-btn:active { transform: scale(.97); }
  .add-btn.added  { background: #28a745; }

  /* ===== CART OVERLAY ===== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }
  .overlay.open { display: flex; }

  .cart-drawer {
    background: white;
    border-radius: 16px 16px 0 0;
    padding: 22px 20px 36px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp .22s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .cart-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--red-dk);
  }

  .close-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--grey);
    display: flex;
    align-items: center;
    padding: 4px;
    border-radius: 6px;
    transition: background .1s;
  }
  .close-btn:hover { background: #f0f0f0; }
  .close-btn .icon { font-size: 26px; }

  .cart-empty-msg {
    text-align: center;
    color: var(--grey);
    font-size: 15px;
    padding: 24px 0;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .cart-item-img {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: contain;
    background: #EBEBEB;
    padding: 4px;
    flex-shrink: 0;
  }

  .cart-item-info { flex: 1; min-width: 0; }

  .cart-item-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cart-item-unit {
    font-size: 12px;
    color: var(--grey);
    margin-top: 2px;
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 0;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .qty-btn {
    background: #f5f5f5;
    border: none;
    width: 34px;
    height: 34px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    transition: background .1s;
  }
  .qty-btn:hover { background: var(--border); }

  .qty-value {
    width: 34px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--text);
    border: none;
    outline: none;
    background: white;
    padding: 0;
  }
  /* hide spinner arrows */
  .qty-value::-webkit-inner-spin-button,
  .qty-value::-webkit-outer-spin-button { -webkit-appearance: none; }
  .qty-value { -moz-appearance: textfield; }

  .cart-item-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--red);
    flex-shrink: 0;
    min-width: 64px;
    text-align: right;
  }

  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #bbb;
    display: flex;
    align-items: center;
    padding: 4px;
    border-radius: 6px;
    transition: color .1s, background .1s;
  }
  .delete-btn:hover { color: var(--red); background: #fff0f0; }
  .delete-btn .icon { font-size: 20px; }

  .cart-footer {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .cart-total-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
  }

  .cart-total-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 30px;
    color: var(--red);
  }

  /* ===== FOOTER ===== */
  footer {
    text-align: center;
    padding: 32px 20px;
    font-size: 12px;
    color: #aaa;
    margin-top: 20px;
  }

  @media (max-width: 400px) {
    .product-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 560px) {
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
    }

    .cart-item-img {
      display: none;
    }

    .cart-item-info {
      grid-column: 1;
      min-width: 0;
    }

    .qty-controls {
      grid-column: 1;
      justify-self: start;
      margin-top: 6px;
    }

    .cart-item-price {
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
      min-width: 70px;
    }

    .delete-btn {
      grid-column: 2;
      grid-row: 2;
      justify-self: end;
      margin-top: 6px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="logopepco.png" alt="Pepco Logo" class="logo-img" onerror="this.style.display='none'">  </div>
  <button class="cart-btn" onclick="openCart()">
    <span class="icon" style="font-size:20px">shopping_cart</span>
    Koszyk
    <div class="cart-badge" id="badge">0</div>
  </button>
</header>

<div class="promo-strip">Najlepsze ceny w Polsce  -  dostawa od 6,99 PLN</div>

<main>
  <div class="section-title">Polecane produkty</div>
  <div class="product-grid" id="productGrid"></div>
</main>

<footer>2026 Cyganskie Pepco</footer>

<!-- CART DRAWER -->
<div class="overlay" id="overlay">
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <div class="cart-title">Twój koszyk</div>
      <button class="close-btn" onclick="closeCart()">
        <span class="icon">close</span>
      </button>
    </div>
    <div id="cartContent"></div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total-label">Razem:</div>
      <div class="cart-total-price" id="totalPrice"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   PRODUKTY  -  edytuj tutaj aby dodac/zmienic produkty
   badge: "new" | "hot" | "sale" | null
   img: sciezka do butter.png obrazka
============================================================ */
const PRODUCTS = [
  {
    id: 1,
    brand: 'Addidas',
    name: 'Bluza',
    desc: 'Niezła bluza dla patyków',
    price: 5.59,
    img: 'addidasbluzapasiuka.png',
    badge: 'new'
  },
  {
    id: 2,
    brand: 'Addidas',
    name: 'Koszulka',
    desc: 'Sportowa koszulka',
    price: 10.59,
    img: 'menunitedkoszulka.png',
    badge: 'hot'
  },
  {
    id: 3,
    brand: 'Krzystof',
    name: 'Butter',
    desc: 'Masło do zgniatania',
    price: 1.12,
    img: 'butter.png',
    badge: 'hot'
  },
  {
    id: 4,
    brand: 'Flex',
    name: 'Maczeta',
    desc: 'Bron dla kibiców',
    price: 6.99,
    img: 'maczeta.png',
    badge: null
  },
  {
    id: 5,
    brand: 'APPLE',
    name: 'Iphone 15 PRO MAX',
    desc: 'Elegancki, ekluzywny telefon',
    price: 53.99,
    img: 'iphone17.png',
    badge: 'sale'
  },
  {
    id: 6,
    brand: 'Brick',
    name: 'Apartament w centrum',
    desc: '860m2',
    price: 23.99,
    img: 'apartament1.png',
    badge: null
  },
  {
    id: 7,
    brand: 'Sweetie Fox',
    name: 'Aktorka',
    desc: 'Ekluzywna filmowa aktorka',
    price: 13.99,
    img: 'cos.png',
    badge: 'hot'
  }
];

/* ============================================================
   KOSZYK
============================================================ */
const cart = {};

function getProduct(id) { return PRODUCTS.find(p => p.id === id); }

function totalItems() {
  return Object.values(cart).reduce((s, q) => s + q, 0);
}

function totalPrice() {
  return Object.entries(cart).reduce((s, [id, q]) => {
    return s + getProduct(+id).price * q;
  }, 0);
}

function fmt(n) { return n.toFixed(2).replace('.', ',') + ' PLN'; }

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  updateBadge();
  flashAddBtn(id);
}

function setQty(id, qty) {
  qty = parseInt(qty, 10);

  if (!Number.isFinite(qty) || qty < 1) {
    removeFromCart(id);
    return;
  }

  cart[id] = qty;
  updateBadge();
  renderCart();
}

function removeFromCart(id) {
  delete cart[id];
  updateBadge();
  renderCart();
}

function updateBadge() {
  const n = totalItems();
  const b = document.getElementById('badge');
  b.textContent = n;
  n > 0 ? b.classList.add('show') : b.classList.remove('show');
}

function flashAddBtn(id) {
  const btn = document.getElementById('addBtn-' + id);
  if (!btn) return;
  btn.classList.add('added');
  btn.textContent = 'Dodano';
  setTimeout(() => {
    btn.classList.remove('added');
    btn.innerHTML = '<span class="icon" style="font-size:18px">add_shopping_cart</span> Dodaj do koszyka';
  }, 1100);
}

/* ============================================================
   RENDER PRODUCTS
============================================================ */
function badgeHTML(badge) {
  if (!badge) return '';
  const labels = { new: 'Nowe', hot: 'Hit', sale: 'Okazja' };
  return `<div class="badge badge-${badge}">${labels[badge] || badge}</div>`;
}

function renderProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="product-card">
      <div class="product-img-wrap">
        <img src="${p.img}" alt="${p.name}" onerror="this.style.opacity='.3'">
        ${badgeHTML(p.badge)}
      </div>
      <div class="product-body">
        <div class="product-brand">${p.brand}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-desc">${p.desc}</div>
        <div class="product-price">${p.price.toFixed(2).replace('.', ',')} <sup>PLN</sup></div>
        <button class="add-btn" id="addBtn-${p.id}" onclick="addToCart(${p.id})">
          <span class="icon" style="font-size:18px">add_shopping_cart</span>
          Dodaj do koszyka
        </button>
      </div>
    </div>
  `).join('');
}

/* ============================================================
   RENDER CART
============================================================ */
function renderCart() {
  const content = document.getElementById('cartContent');
  const footer  = document.getElementById('cartFooter');
  const total   = document.getElementById('totalPrice');
  const ids     = Object.keys(cart);

  if (ids.length === 0) {
    content.innerHTML = '<div class="cart-empty-msg">Koszyk jest pusty.</div>';
    footer.style.display = 'none';
    return;
  }

  content.innerHTML = ids.map(id => {
    const p = getProduct(+id);
    const q = cart[id];
    const linePrice = (p.price * q).toFixed(2).replace('.', ',') + ' PLN';
    return `
      <div class="cart-item">
        <img class="cart-item-img" src="${p.img}" alt="${p.name}" onerror="this.style.opacity='.3'">
        <div class="cart-item-info">
          <div class="cart-item-name">${p.brand} ${p.name}</div>
          <div class="cart-item-unit">${p.price.toFixed(2).replace('.', ',')} PLN / szt.</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="setQty(${id}, ${q - 1})">-</button>
          <input class="qty-value" type="number" value="${q}" min="1" step="1"
            aria-label="Ilość produktu"
            onchange="setQty(${id}, this.value)"
            onkeydown="if(event.key==='Enter'){this.blur();}"
            oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <button class="qty-btn" onclick="setQty(${id}, ${q + 1})">+</button>
        </div>
        <div class="cart-item-price">${linePrice}</div>
        <button class="delete-btn" onclick="removeFromCart(${id})" title="Usuń">
          <span class="icon">delete</span>
        </button>
      </div>
    `;
  }).join('');

  total.textContent = fmt(totalPrice());
  footer.style.display = 'flex';
}

/* ============================================================
   OVERLAY
============================================================ */
function openCart() {
  renderCart();
  document.getElementById('overlay').classList.add('open');
}

function closeCart() {
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) closeCart();
});

/* ============================================================
   INIT
============================================================ */
renderProducts();
</script>
</body>
</html>
